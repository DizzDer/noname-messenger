<text x="1530" y="437.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">users.id сілтемесі</text>
<polyline points="1287,454 1828,454" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1291" y="486.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">expires</text>
<text x="1530" y="485.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Жарамдылық мерзімі</text>
<rect x="1053" y="636" width="797" height="413" rx="16" fill="#ffffff" stroke="#dbe8e9" stroke-width="2"/>
<rect x="1053" y="636" width="797" height="96" rx="16" fill="#edf4f5"/>
<text x="1081" y="682.39" fill="#087f79" font-family="Arial, sans-serif" font-size="29" font-weight="700">messages</text>
<text x="1081" y="715.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Жеке хабарламалар</text>
<text x="1079" y="770.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">id PK</text>
<text x="1318" y="769.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Хабар кілті</text>
<polyline points="1075,786 1828,786" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1079" y="818.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">sender FK</text>
<text x="1318" y="817.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">users.id — жіберуші</text>
<polyline points="1075,834 1828,834" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1079" y="866.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">recipient FK</text>
<text x="1318" y="865.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">users.id — алушы</text>
<polyline points="1075,882 1828,882" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1079" y="914.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">body / sent</text>
<text x="1318" y="913.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Мәтін және жіберілген уақыт</text>
<polyline points="1075,930 1828,930" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1079" y="962.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">read_at / deleted</text>
<text x="1318" y="961.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Оқылу уақыты және жою белгісі</text>
<polyline points="1075,978 1828,978" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1079" y="1010.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">nonce</text>
<text x="1318" y="1009.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Қайталама жіберуді болдырмау</text>
<polyline points="625,400 850,400 850,395 1265,395" fill="none" stroke="#087f79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1253,388 1265,395 1253,402" fill="none" stroke="#087f79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="718" y="371.84" fill="#087f79" font-family="Arial, sans-serif" font-size="24" font-weight="700">1 → көп</text>
<polyline points="625,520 774,520 774,790 1053,790" fill="none" stroke="#087f79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1041,783 1053,790 1041,797" fill="none" stroke="#087f79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="802" y="764.93" fill="#087f79" font-family="Arial, sans-serif" font-size="23" font-weight="700">Жіберуші</text>
<polyline points="625,585 722,585 722,882 1053,882" fill="none" stroke="#087f79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1041,875 1053,882 1041,889" fill="none" stroke="#087f79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="802" y="920.93" fill="#087f79" font-family="Arial, sans-serif" font-size="23" font-weight="700">Алушы</text>
<text x="70" y="777.66" fill="#183238" font-family="Arial, sans-serif" font-size="26" font-weight="700">Деректермен орындалатын әрекеттер</text>
<text x="70" y="841.84" fill="#087f79" font-family="Arial, sans-serif" font-size="24" font-weight="700">Қосу → оқу → іздеу → өзгерту → жою</text>
<text x="70" y="900.93" fill="#547079" font-family="Arial, sans-serif" font-size="23" font-weight="400">Пайдаланушы өз жіберген хабарын ғана</text>
<text x="70" y="938.93" fill="#547079" font-family="Arial, sans-serif" font-size="23" font-weight="400">өзгертіп немесе жоя алады.</text>
<text x="70" y="1121.93" fill="#547079" font-family="Arial, sans-serif" font-size="23" font-weight="400">Бірегей шектеу: messages(sender, nonce). Бір хабарды қайта жіберу көшірме жасамайды.</text>
<text x="70" y="1172.93" fill="#547079" font-family="Arial, sans-serif" font-size="23" font-weight="400">Құпиясөз ашық мәтінмен сақталмайды. Сеанс токенінің өзі клиент жадында ғана болады.</text>
<text x="70" y="1223.93" fill="#087f79" font-family="Arial, sans-serif" font-size="23" font-weight="700">PK — негізгі кілт. FK — басқа кестенің негізгі кілтіне сілтеме.</text>
</svg>