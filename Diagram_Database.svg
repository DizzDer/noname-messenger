<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1260" viewBox="0 0 1920 1260">
<title>Noname Messenger SQLite деректер базасының сызбасы</title>
<desc>Қазақ тіліндегі өңделетін жоба макеті және техникалық сызба</desc>
<rect width="1920" height="1260" fill="#f6f9fa"/>
<text x="70" y="69.11" fill="#087f79" font-family="Arial, sans-serif" font-size="21" font-weight="700">NONAME MESSENGER</text>
<text x="70" y="131.04" fill="#183238" font-family="Arial, sans-serif" font-size="44" font-weight="700">Деректер базасының құрылымы</text>
<text x="70" y="177.84" fill="#547079" font-family="Arial, sans-serif" font-size="24" font-weight="400">SQLite · Сыртқы кілттер · Параметрленген сұраулар · WAL журналы</text>
<rect x="70" y="286" width="555" height="413" rx="16" fill="#ffffff" stroke="#dbe8e9" stroke-width="2"/>
