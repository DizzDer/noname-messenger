<text x="96" y="564.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">salt</text>
<text x="335" y="563.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Кездейсоқ тұз</text>
<polyline points="92,580 603,580" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="612.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">password_hash</text>
<text x="335" y="611.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">PBKDF2 хэші</text>
<polyline points="92,628 603,628" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="660.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">last_seen</text>
<text x="335" y="659.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Соңғы белсенділік</text>
<rect x="1265" y="256" width="585" height="269" rx="16" fill="#ffffff" stroke="#dbe8e9" stroke-width="2"/>
<rect x="1265" y="256" width="585" height="96" rx="16" fill="#edf4f5"/>
<text x="1293" y="302.39" fill="#087f79" font-family="Arial, sans-serif" font-size="29" font-weight="700">sessions</text>
<text x="1293" y="335.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Кіру сеанстары</text>
<text x="1291" y="390.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">digest PK</text>
<text x="1530" y="389.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Токеннің SHA256 хэші</text>
<polyline points="1287,406 1828,406" fill="none" stroke="#dbe8e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
