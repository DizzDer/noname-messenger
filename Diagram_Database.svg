<text x="96" y="516.11" fill="#183238" font-family="Arial, sans-serif" font-size="21" font-weight="700">name</text>
<text x="335" y="515.2" fill="#547079" font-family="Arial, sans-serif" font-size="20" font-weight="400">Көрсетілетін ат</text>
