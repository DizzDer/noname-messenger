<text x="850" y="972.93" fill="#087f79" font-family="Arial, sans-serif" font-size="23" font-weight="700">Алушының клиенті кіріс хабарларын бағалайды</text>
<text x="70" y="1035.93" fill="#547079" font-family="Arial, sans-serif" font-size="23" font-weight="400">TLS желілік байланысты қорғайды. Сервер хабарлама мәтінін оқи алады. Бұл нұсқада E2EE іске асырылмаған.</text>
